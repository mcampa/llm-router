model_list:
  # "local" -> self-hosted vLLM on the Docker host, port 8000
  - model_name: local
    litellm_params:
      model: hosted_vllm/qwen3.8-flash-next
      # compose service name - resolved on the bridge, no host hop.
      # /v1 IS required: the hosted_vllm provider appends the path verbatim
      # (litellm POSTs to {api_base}/chat/completions), so without it vLLM 404s.
      api_base: http://vllm:8000/v1
      # no api_key: the vLLM server has auth disabled
      # LiteLLM does not cancel the upstream call when a client disconnects, so
      # without these an abandoned request holds a vLLM slot until it finishes.
      # stream_timeout is the gap allowed between streamed bytes, which covers
      # time spent waiting in vLLM's queue. 180s matches the Yeiberson stall
      # watchdog: by then the caller has given up anyway.
      timeout: 600
      stream_timeout: 180

  # "deepseek" -> DeepSeek cloud API
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      # DeepSeek can stop answering completions while the API still accepts
      # connections (2026-10-01). Without a timeout each request hangs, never
      # fails over, and stays open upstream after the caller gives up.
      timeout: 120
      stream_timeout: 60

  # "deepseek-cloud" -> DeepSeek cloud API, no fallback. For background callers
  # (Hindsight fact extraction) that should fail and retry later rather than
  # take vLLM slots from interactive turns when DeepSeek is down.
  - model_name: deepseek-cloud
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 120
      stream_timeout: 60
      # Extra requests wait for a slot, so a retain burst cannot crowd out the
      # interactive `deepseek` route's share of the account rate limit.
      max_parallel_requests: 4

# The Admin UI Fallbacks "play" button sends mock_testing_fallbacks. Without
# this, that request 400s. Any caller with a valid key can then inject synthetic
# failures; this proxy is LAN-only behind LITELLM_MASTER_KEY.
general_settings:
  dangerously_allow_mock_testing_request_params: true

litellm_settings:
  # NOTE: LiteLLM's built-in Prometheus /metrics exporter is an Enterprise
  # feature (moved out of beta into Enterprise on 2024-09-15, ~$250/mo). On this
  # OSS build, enabling `callbacks: ["prometheus"]` does NOT serve /metrics
  # (verified: 404 even with the master key). Left disabled; gateway metrics are
  # covered by the free community DB-exporter if wired up separately.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 600

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # No same-deployment retries. The default is 2, which triples every timeout
  # above (a hung DeepSeek took 360s to fail over instead of 120s). Fallbacks
  # cover the cross-route case, and callers retry on their own.
  num_retries: 0
  # When DeepSeek cloud fails (insufficient balance, 5xx, timeout), retry on
  # the self-hosted vLLM alias. Callers still request model "deepseek".
  fallbacks:
    - deepseek: [local]
    # When self-hosted vLLM is down (container crash, GPU OOM, restart), retry on
    # DeepSeek cloud. Callers still request model "local".
    - local: [deepseek]
    # `deepseek-cloud` has no fallback on purpose. See its model_list entry.
  # One billing 400 is enough to mark the cloud deployment unhealthy so later
  # turns skip it for cooldown_time instead of paying the DeepSeek round trip
  # on every request until the balance is topped up.
  allowed_fails: 1
  cooldown_time: 300
