services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    restart: always
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  # ===========================================================================
  #  vLLM backend - exactly ONE of the three services below may be uncommented.
  #
  #  All three are the same service name (`vllm`) with the same ports and the same
  #  --served-model-name (qwen3.8-flash-next), so LiteLLM's http://vllm:8000/v1
  #  and the `local` model alias never change when you switch. config.yaml is
  #  untouched by a switch and no caller can tell which backend is up.
  #
  #  TO SWITCH: comment out the block that is active, uncomment the one you want,
  #  then
  #      docker compose up -d --remove-orphans
  #  Only one may run at a time - they would fight for the GPU and port 8000, and
  #  the box has unified memory for one of them, not two. The commented-out ones
  #  additionally need their checkpoint downloaded first; each startup script
  #  fails fast with the download command if it is missing.
  #
  #  qwen38-fast and qwen38 run Eugr's B12x image; qwen38-hibrid48 runs bilikaz's
  #  myllmbox v4 image. Both images are pinned by digest, because the upstream
  #  `latest` tags have since moved and the newer builds are not drop-ins for
  #  these checkpoints.
  # ===========================================================================

  # --- ACTIVE: qwen38-fast - Qwen3.8-Flash-Next A5B INT4 AutoRound ------------
  # The 125B-A5B Intel AutoRound int4 requant (~33% faster decode than the full
  # NVFP4 model on this box) served by the current B12x stack. See
  # vllm-start-fast.sh for the serve flags and mods/flashnext-int4-b12x/ for the
  # model views + vLLM patches it applies at startup.
  vllm:
    image: eugr/spark-vllm-b12x@sha256:8e7e062186f841453ef0ec6f713043c5b65447decc3835206685128c18e42262
    restart: always
    container_name: vllm-qwen38-flash
    # On the compose bridge, deliberately NOT host networking. vLLM passes
    # --host 0.0.0.0 inside its own network namespace; the published port below
    # is what controls host/LAN reachability.
    ports:
      # Loopback mapping preserved so host-side tooling (bench_qwen38_flash.py,
      # healthcheck_qwen38_flash.sh) keeps working against 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
      # LAN mapping so Prometheus on 192.168.0.40 can scrape /metrics. NOTE: this
      # also exposes the full OpenAI API (chat/completions, etc.) to the LAN - a
      # deliberate trade-off chosen over a metrics-only reverse proxy.
      - "192.168.0.96:8000:8000"
    ipc: host
    shm_size: 32gb
    ulimits:
      memlock: -1
      nofile: 65535
      stack: 67108864
    # Eugr's launcher runs privileged; this is the documented non-privileged
    # equivalent (with memlock above and /dev/infiniband below).
    cap_add:
      - IPC_LOCK
    # REQUIRED: the B12x disk PLE reader (VLLM_PLE_TABLE_MEMORY=disk) does its
    # scatter-gather reads through io_uring, and Docker's default seccomp profile
    # blocks io_uring_setup -> "io_uring initialization failed: Operation not
    # permitted" a few minutes into the weight load. Unconfining seccomp is what
    # `--privileged` (Eugr's launcher default) gives you anyway; everything else
    # here stays restricted, unlike --privileged.
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/infiniband:/dev/infiniband
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /home/mcampa/.cache/huggingface:/cache/huggingface
      # The upstream `flashnext-int4-b12x` mod, vendored: it builds the served-model
      # views under /workspace/flashnext and patches this container's vLLM.
      - ./mods/flashnext-int4-b12x:/workspace/mod:ro
      # Chat templates. These are the checkpoints' own templates with one change:
      # consecutive leading system messages are merged instead of raising. See
      # chat-templates/ and the README.
      - ./chat-templates:/workspace/chat-templates:ro
      # The serve command. Read-only, and invoked via /bin/bash so the exec bit
      # and bind-mount ownership don't matter.
      - ./vllm-start-fast.sh:/workspace/vllm-start-fast.sh:ro
    environment:
      # --- B12x stack (Eugr's GB10 build) -------------------------------------
      CUTE_DSL_ARCH: sm_121a
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      B12X_POLICY_MODE: auto
      # RoCE all-reduce. Carried over verbatim from the upstream solo recipe; inert
      # on a single GB10 (there is no RDMA peer to reduce with).
      VLLM_ENABLE_ROCE_ALLREDUCE: "1"
      VLLM_ROCE_ALLREDUCE_MAX_SIZE: 2MB
      # --- PLE n-gram table streamed from disk (the reason this fits one Spark) ---
      VLLM_PLE_TABLE_MEMORY: disk
      # --- this checkpoint: blockwise-fp8 side layers inside a GPTQ container ----
      VLLM_FP8_HYBRID: "1"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      # --- MTP draft: scale the draft's logits before the accept test ----------
      VLLM_MTP_DRAFT_SCALE: "2"
      # --- offline HF cache: weights live in the bind mount above --------------
      HOME: /tmp
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    # Replaces the image's ENTRYPOINT ["vllm","serve"] instead of appending to
    # it. A script cannot go in `command:` - that entrypoint would prepend itself
    # and yield argv "vllm serve /workspace/vllm-start-fast.sh".
    entrypoint: ["/bin/bash", "/workspace/vllm-start-fast.sh"]
    healthcheck:
      # /health 200s only once weights are loaded - ~10-13 min cold.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s

  # --- ALTERNATIVE: qwen38 - full Qwen3.8-Flash-Next NVFP4 --------------------
  # The 125B-A6B NVIDIA ModelOpt NVFP4 checkpoint, served with the b12x loader.
  # Same image, same ports, same served model name. Requires a separate ~124 GiB
  # download of local-inference-lab/Qwen3.8-Flash-Next-NVFP4 - this is NOT the
  # nvidia/Qwen3.8-Flash-Next-NVFP4 checkpoint, which no current B12x recipe
  # targets. To activate: delete the leading '#' from this block and add one to
  # the block above, then `docker compose up -d --remove-orphans`.
  #
  # vllm:
  #   image: eugr/spark-vllm-b12x@sha256:8e7e062186f841453ef0ec6f713043c5b65447decc3835206685128c18e42262
  #   restart: always
  #   container_name: vllm-qwen38-flash
  #   ports:
  #     - "127.0.0.1:8000:8000"
  #     - "192.168.0.96:8000:8000"
  #   ipc: host
  #   shm_size: 32gb
  #   ulimits:
  #     memlock: -1
  #     nofile: 65535
  #     stack: 67108864
  #   cap_add:
  #     - IPC_LOCK
  #   # REQUIRED for the disk PLE reader's io_uring use - see the note on the
  #   # active service above.
  #   security_opt:
  #     - seccomp=unconfined
  #   devices:
  #     - /dev/infiniband:/dev/infiniband
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   volumes:
  #     - /etc/passwd:/etc/passwd:ro
  #     - /etc/group:/etc/group:ro
  #     - /home/mcampa/.cache/huggingface:/cache/huggingface
  #     # No mod here: Eugr's NVFP4 recipe has none. The chat template is the
  #     # model's own with the leading-system-message merge applied.
  #     - ./chat-templates:/workspace/chat-templates:ro
  #     - ./vllm-start-full.sh:/workspace/vllm-start-full.sh:ro
  #   environment:
  #     # --- B12x stack, from Eugr's qwen3.8-flash-next-nvfp4-solo recipe ------
  #     VLLM_PLE_TABLE_MEMORY: disk
  #     CUTE_DSL_ARCH: sm_121a
  #     SAFETENSORS_FAST_GPU: "1"
  #     VLLM_WORKER_MULTIPROC_METHOD: spawn
  #     VLLM_SSM_CONV_STATE_LAYOUT: DS
  #     VLLM_USE_AOT_COMPILE: "1"
  #     VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  #     VLLM_USE_V2_MODEL_RUNNER: "1"
  #     B12X_POLICY_MODE: auto
  #     VLLM_MXFP8_LM_HEAD: "1"
  #     VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
  #     # --- offline HF cache: weights live in the bind mount above ------------
  #     HOME: /tmp
  #     HF_HOME: /cache/huggingface
  #     HF_HUB_CACHE: /cache/huggingface/hub
  #     HF_HUB_OFFLINE: "1"
  #     TRANSFORMERS_OFFLINE: "1"
  #   entrypoint: ["/bin/bash", "/workspace/vllm-start-full.sh"]
  #   healthcheck:
  #     test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 1200s

  # --- ALTERNATIVE: qwen38-hibrid48 - NVFP4 body, n-gram table on local NVMe --
  # bilikaz's single-Spark kit (myllmbox image v4, vLLM 0.30): the 125B-A6B NVFP4
  # checkpoint with a 4-bit output head, whose n-gram table is demand-paged from local
  # NVMe by the image's own reader instead of being held in memory. No RDMA peer and no
  # second box - this is the local-NVMe sibling of the engine behind Saren's magi-v2,
  # not the RDMA one. A different model and a different image from qwen38-fast; served
  # for comparison against it.
  #
  # To activate: comment out the ACTIVE qwen38-fast block above, delete the leading '#'
  # from this block, then `docker compose up -d --remove-orphans`. Reversing that
  # switches back. The checkpoint is a separate ~98 GiB download and the first boot
  # writes a ~31 GiB table map, so give it ~130 GB of NVMe; see the README.
  #
  # vllm:
  #   image: myllmbox/qwen38-flash-next-vllm@sha256:51629f438f5ba3f7a96db110826c783d69b91a6851c43fb07d447644f157dcc4
  #   restart: always
  #   container_name: vllm-qwen38-flash
  #   ports:
  #     - "127.0.0.1:8000:8000"
  #     - "192.168.0.96:8000:8000"
  #   ipc: host
  #   shm_size: 32gb
  #   # Upstream's cpuset: the GB10's ten 3.9GHz Cortex-X925 cores (0-4 and 10-14 are
  #   # 2.8GHz A725). Worth a couple of percent; drop it to let the scheduler place this
  #   # alongside the other containers instead.
  #   cpuset: "5-9,15-19"
  #   ulimits:
  #     nofile: 65535
  #   # REQUIRED: the image's NVMe table reader uses io_uring, and Docker's default
  #   # seccomp profile blocks io_uring_setup. Upstream passes the same thing via
  #   # docker_args, and still runs the container unprivileged.
  #   security_opt:
  #     - seccomp=unconfined
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   volumes:
  #     # The checkpoint, ~98 GiB - a real directory from `hf download --local-dir`, not
  #     # the shared HF cache the other backends use. Read-write, as in the upstream kit.
  #     - /models/qwen38/models:/models
  #     # MUST be writable and MUST be NVMe: the first boot prepares the ~31 GiB table map
  #     # here (a few minutes, once) and every later request reads it. On tmpfs it would be
  #     # rebuilt on every boot and eat the unified memory this is meant to free.
  #     - /models/qwen38/cache:/cache
  #     # Our chat template: the checkpoint's own with leading system messages merged -
  #     # see chat-templates/ and the README.
  #     - ./chat-templates:/workspace/chat-templates:ro
  #     - ./vllm-start-hibrid48.sh:/workspace/vllm-start-hibrid48.sh:ro
  #   environment:
  #     # --- the image's table reader, demand-paging the n-gram table from /cache -----
  #     MBX_PLE_MMAP: "1"
  #     MBX_PLE_MMAP_MODE: nvme
  #     MBX_PLE_MMAP_PREWARM: "0"
  #     VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  #     VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  #     # --- the recipe's env ---------------------------------------------------------
  #     TORCH_CUDA_ARCH_LIST: "12.1a"
  #     FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  #     PYTHONUNBUFFERED: "1"
  #     # glibc hands big freed blocks back to the OS at once; without this the loader's
  #     # garbage stays resident and swaps.
  #     MALLOC_MMAP_THRESHOLD_: "65536"
  #     MALLOC_TRIM_THRESHOLD_: "131072"
  #     # --- writable state, both under the /cache mount -------------------------------
  #     VLLM_CACHE_ROOT: /cache/vllm-cache
  #     FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
  #     # --- nothing is fetched at runtime --------------------------------------------
  #     HF_HUB_OFFLINE: "1"
  #     TRANSFORMERS_OFFLINE: "1"
  #   entrypoint: ["/bin/bash", "/workspace/vllm-start-hibrid48.sh"]
  #   healthcheck:
  #     test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 1200s

  # --- Observability sidecars: scraped by Prometheus on 192.168.0.40 ---

  # GPU metrics (util, clocks, power, energy, temps, NVLink, PCIe, XID errors).
  # Replaces the previously hand-run `docker run` container so compose owns it.
  # DCP/profiling fields aren't loaded on GB10 - the default counter set works.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    restart: unless-stopped
    container_name: dcgm-exporter
    cap_add:
      - SYS_ADMIN
    ports:
      # LAN-reachable so Prometheus (192.168.0.40) can scrape GPU metrics.
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Host resources for this box (gx10 / trantor): CPU, load, RAM (unified memory
  # on GB10), swap, disk usage/IO, network, filesystem, uptime.
  # Deliberately docker-published (NOT network_mode: host): the host has ufw
  # active, and ufw filters the INPUT chain but not docker's FORWARD/DNAT chains.
  # A host-networked bind on 9100 is dropped by ufw for LAN clients, whereas a
  # docker-published port is reachable from Prometheus (192.168.0.40) - the same
  # path the dcgm-exporter sidecar uses successfully.
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    container_name: node-exporter
    pid: host
    # disable-defaults + an explicit allowlist: several default collectors
    # (hwmon, thermal_zone, powersupplyclass, rapl, nvme, mdadm, edac) block on
    # exotic hardware sysfs on the GB10/Grace-Blackwell platform and intermittently
    # hang the whole /metrics handler. This curated set covers CPU/mem/disk/net/fs
    # and always scrapes in <20ms. GPU temp/power/util come from dcgm-exporter.
    command:
      - "--path.rootfs=/host"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.loadavg"
      - "--collector.meminfo"
      - "--collector.vmstat"
      - "--collector.stat"
      - "--collector.filesystem"
      - "--collector.diskstats"
      - "--collector.netdev"
      - "--collector.netstat"
      - "--collector.sockstat"
      - "--collector.uname"
      - "--collector.os"
      - "--collector.time"
      - "--collector.filefd"
      - "--collector.pressure"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave

volumes:
  postgres_data:
  redis_data:
