services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    restart: always
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  # Qwen3.8-Flash-Next-NVFP4 on the DGX Spark, lifted from sparkrun recipe
  # ~/sparkrun-recipes/recipes/qwen3.8-flash-next-nvfp4.yaml.
  # Local-only image (not on a registry) - never pulled.
  vllm:
    image: qwen38-flash-dgx:nvfp4
    restart: always
    container_name: vllm-qwen38-flash
    # On the compose bridge, deliberately NOT host networking. vLLM passes
    # --host 0.0.0.0 inside its own network namespace; the published port below
    # is what controls host/LAN reachability.
    ports:
      # Loopback mapping preserved so host-side tooling (bench_qwen38_flash.py,
      # healthcheck_qwen38_flash.sh) keeps working against 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
      # LAN mapping so Prometheus on 192.168.0.40 can scrape /metrics. NOTE: this
      # also exposes the full OpenAI API (chat/completions, etc.) to the LAN - a
      # deliberate trade-off chosen over a metrics-only reverse proxy.
      - "192.168.0.96:8000:8000"
    ipc: host
    shm_size: 32gb
    ulimits:
      memlock: -1
      nofile: 65535
      stack: 67108864
    devices:
      - /dev/infiniband:/dev/infiniband
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /home/mcampa/.cache/huggingface:/cache/huggingface
      # The recipe's @mcampa/fix-qwen3.8-flash-chat-template mod; this file differs
      # from the one inside the checkpoint snapshot, so it must win.
      - ./chat_template.jinja:/workspace/vllm/chat_template.jinja:ro
      # The serve command. Read-only, and invoked via /bin/bash so the exec bit
      # and bind-mount ownership don't matter.
      - ./vllm-start.sh:/workspace/vllm-start.sh:ro
    environment:
      # --- PLE n-gram table mmapped from NVMe (the reason this fits one Spark) ---
      VLLM_PLE_MMAP: "1"
      VLLM_PLE_MMAP_WORKERS: "32"
      VLLM_PLE_MMAP_PREWARM: "0"
      VLLM_PLE_MMAP_MADVISE: random
      # --- hybrid NVFP4 experts + blockwise-fp8 side layers ---
      VLLM_FP8_HYBRID: "1"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_FP8_PAD_M4: "0"
      # --- deterministic QSA top-k (stock persistent_topk drops candidates on GB10) ---
      VLLM_QSA_DET_TOPK: "1"
      VLLM_QSA_DET_LIB: /opt/llm/kernel-det/_C_det.so
      VLLM_QSA_EXACT_TOPK: "0"
      # --- reduced MTP draft vocab ---
      VLLM_MTP_DRAFT_VOCAB: /opt/llm/draft_vocab_65536.npy
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "600"
      CUTE_DSL_ARCH: sm_121a
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # --- offline HF cache: weights live in the bind mount above ---
      HOME: /tmp
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    # Replaces the image's ENTRYPOINT ["vllm","serve"] instead of appending to
    # it. A script cannot go in `command:` - that entrypoint would prepend itself
    # and yield argv "vllm serve /workspace/vllm-start.sh". See vllm-start.sh.
    entrypoint: ["/bin/bash", "/workspace/vllm-start.sh"]
    healthcheck:
      # /health 200s only once weights are loaded - ~10-13 min cold.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s

  # --- Observability sidecars: scraped by Prometheus on 192.168.0.40 ---

  # GPU metrics (util, clocks, power, energy, temps, NVLink, PCIe, XID errors).
  # Replaces the previously hand-run `docker run` container so compose owns it.
  # DCP/profiling fields aren't loaded on GB10 - the default counter set works.
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    restart: unless-stopped
    container_name: dcgm-exporter
    cap_add:
      - SYS_ADMIN
    ports:
      # LAN-reachable so Prometheus (192.168.0.40) can scrape GPU metrics.
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Host resources for this box (gx10 / trantor): CPU, load, RAM (unified memory
  # on GB10), swap, disk usage/IO, network, filesystem, uptime.
  # Deliberately docker-published (NOT network_mode: host): the host has ufw
  # active, and ufw filters the INPUT chain but not docker's FORWARD/DNAT chains.
  # A host-networked bind on 9100 is dropped by ufw for LAN clients, whereas a
  # docker-published port is reachable from Prometheus (192.168.0.40) - the same
  # path the dcgm-exporter sidecar uses successfully.
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    container_name: node-exporter
    pid: host
    # disable-defaults + an explicit allowlist: several default collectors
    # (hwmon, thermal_zone, powersupplyclass, rapl, nvme, mdadm, edac) block on
    # exotic hardware sysfs on the GB10/Grace-Blackwell platform and intermittently
    # hang the whole /metrics handler. This curated set covers CPU/mem/disk/net/fs
    # and always scrapes in <20ms. GPU temp/power/util come from dcgm-exporter.
    command:
      - "--path.rootfs=/host"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.loadavg"
      - "--collector.meminfo"
      - "--collector.vmstat"
      - "--collector.stat"
      - "--collector.filesystem"
      - "--collector.diskstats"
      - "--collector.netdev"
      - "--collector.netstat"
      - "--collector.sockstat"
      - "--collector.uname"
      - "--collector.os"
      - "--collector.time"
      - "--collector.filefd"
      - "--collector.pressure"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave

volumes:
  postgres_data:
  redis_data:
