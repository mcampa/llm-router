services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    restart: always
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  # ===========================================================================
  #  vLLM backend - exactly ONE of the two services below may be uncommented.
  #
  #  Both are the same service name (`vllm`) with the same ports and the same
  #  --served-model-name (qwen3.8-flash-next), so LiteLLM's http://vllm:8000/v1
  #  and the `local` model alias never change when you switch. config.yaml is
  #  untouched by a switch and no caller can tell which backend is up.
  #
  #  TO SWITCH: comment out the block that is active, uncomment the other, then
  #      docker compose up -d --remove-orphans
  #  Only one may run at a time - they would fight for the GPU and port 8000.
  #  The commented-out one additionally needs its checkpoint downloaded first;
  #  its startup script fails fast with the download command if it is missing.
  #
  #  Both use Eugr's B12x image, pinned by digest because upstream `latest` has
  #  since moved and the newer build is not a drop-in for these checkpoints.
  # ===========================================================================

  # --- ACTIVE: qwen38-myllmbox - myllmbox v5.2 + azampatti INT4-AutoRound ------
  # myllmbox's qwen38-flash-next-recipe v5.2 image, serving the SAME checkpoint as
  # qwen38-fast (azampatti's 125B-A5B INT4 AutoRound), so the two differ by engine
  # and settings rather than by model. Mirrors recipe.yaml at v5.2 plus the
  # INT4-AutoRound profile run.sh applies - see vllm-start-myllmbox.sh, which
  # transcribes every flag and names the departures.
  #
  # Why this is staged: v5.2 is the first image in this family with the QSA
  # long-prefill workspace fix (vllm#57105) built in, which is the one patch aimed
  # at the deep-context slowdown both of this repo's existing stacks show at 64K x
  # c>=4. Between that, MTP 5/7 on block_size 1632, and RecoverSSM, this is the
  # candidate replacement for qwen38-fast - measured before it is promoted.
  vllm:
    image: myllmbox/qwen38-flash-next-vllm:v5.2
    restart: always
    container_name: vllm-qwen38-flash
    ports:
      - "127.0.0.1:8000:8000"
      - "192.168.0.96:8000:8000"
    ipc: host
    shm_size: 32gb
    # The GB10's ten Cortex-X925 cores (3.9GHz); 0-4 and 10-14 are 2.8GHz A725.
    # The recipe measured this at +2-3% at every concurrency.
    cpuset: "5-9,15-19"
    ulimits:
      memlock: -1
      nofile: 65535
      stack: 67108864
    # REQUIRED: the image's table reader, same reason the B12x stack needs it.
    security_opt:
      - seccomp=unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # The HF repo dir is mounted WHOLE, not its snapshot/: snapshot entries are
      # relative symlinks into ../../blobs/, so mounting the snapshot alone leaves
      # every weight dangling. vllm-start-myllmbox.sh resolves refs/main inside.
      - /home/mcampa/.cache/huggingface/hub/models--azampatti--Qwen3.8-Flash-Next-125B-A5B-INT4-AutoRound:/models/azampatti
      # Compile caches, the draft folder, and this checkpoint's own fp8 n-gram table
      # map (~52G, built on the first boot of this backend).
      - /models/qwen38/cache:/cache
      # Chat templates. `qwen38-fast-medium.jinja` is passed explicitly by the script: the
      # recipe passes none, so the checkpoint's own template would 400 on the consecutive
      # leading system messages this repo's harnesses emit. See the note in the script.
      - ./chat-templates:/workspace/chat-templates:ro
      - ./vllm-start-myllmbox.sh:/workspace/vllm-start-myllmbox.sh:ro
    environment:
      # --- PLE n-gram table demand-paged from NVMe (the image's own reader) -----
      MBX_PLE_MMAP: "1"
      MBX_PLE_MMAP_MODE: nvme
      MBX_PLE_MMAP_PREWARM: "0"
      # --- image defaults, transcribed from recipe.yaml ------------------------
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      PYTHONUNBUFFERED: "1"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      # glibc returns big freed blocks to the OS at once; on unified memory the
      # loader's garbage otherwise stays resident - and swaps.
      MALLOC_MMAP_THRESHOLD_: "65536"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # --- INT4-AutoRound profile (run.sh applies these off ple-table/) --------
      VLLM_FP8_HYBRID: "1"
      MBX_MTP_DRAFT_SCALE: "2"
      # --- offline HF cache / caches -------------------------------------------
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
      VLLM_CACHE_ROOT: /cache/vllm-cache
    entrypoint: ["/bin/bash", "/workspace/vllm-start-myllmbox.sh"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s


#   # --- ACTIVE: qwen38-fast - Qwen3.8-Flash-Next A5B INT4 AutoRound ------------
#   # The 125B-A5B Intel AutoRound int4 requant (~33% faster decode than the full
#   # NVFP4 model on this box) served by the current B12x stack. See
#   # vllm-start-fast.sh for the serve flags and mods/flashnext-int4-b12x/ for the
#   # model views + vLLM patches it applies at startup.
#   vllm:
#     image: eugr/spark-vllm-b12x@sha256:8e7e062186f841453ef0ec6f713043c5b65447decc3835206685128c18e42262
#     restart: always
#     container_name: vllm-qwen38-flash
#     # On the compose bridge, deliberately NOT host networking. vLLM passes
#     # --host 0.0.0.0 inside its own network namespace; the published port below
#     # is what controls host/LAN reachability.
#     ports:
#       # Loopback mapping preserved so host-side tooling (bench_qwen38_flash.py,
#       # healthcheck_qwen38_flash.sh) keeps working against 127.0.0.1:8000.
#       - "127.0.0.1:8000:8000"
#       # LAN mapping so Prometheus on 192.168.0.40 can scrape /metrics. NOTE: this
#       # also exposes the full OpenAI API (chat/completions, etc.) to the LAN - a
#       # deliberate trade-off chosen over a metrics-only reverse proxy.
#       - "192.168.0.96:8000:8000"
#     ipc: host
#     shm_size: 32gb
#     ulimits:
#       memlock: -1
#       nofile: 65535
#       stack: 67108864
#     # Eugr's launcher runs privileged; this is the documented non-privileged
#     # equivalent (with memlock above and /dev/infiniband below).
#     cap_add:
#       - IPC_LOCK
#     # REQUIRED: the B12x disk PLE reader (VLLM_PLE_TABLE_MEMORY=disk) does its
#     # scatter-gather reads through io_uring, and Docker's default seccomp profile
#     # blocks io_uring_setup -> "io_uring initialization failed: Operation not
#     # permitted" a few minutes into the weight load. Unconfining seccomp is what
#     # `--privileged` (Eugr's launcher default) gives you anyway; everything else
#     # here stays restricted, unlike --privileged.
#     security_opt:
#       - seccomp=unconfined
#     devices:
#       - /dev/infiniband:/dev/infiniband
#     deploy:
#       resources:
#         reservations:
#           devices:
#             - driver: nvidia
#               count: all
#               capabilities: [gpu]
#     volumes:
#       - /etc/passwd:/etc/passwd:ro
#       - /etc/group:/etc/group:ro
#       - /home/mcampa/.cache/huggingface:/cache/huggingface
